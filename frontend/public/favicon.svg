<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep midnight travel blue to vibrant sapphire -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a" />
      <stop offset="50%" stop-color="#0c2e56" />
      <stop offset="100%" stop-color="#031527" />
    </linearGradient>

    <!-- Pin Gradient: Vibrant sunset coral-amber (Tourist hallmark) -->
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b4a" />
      <stop offset="60%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Compass Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>

    <!-- Cyan Glow -->
    <linearGradient id="flightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Outer Ring Glow -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.3" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    
    <filter id="pinShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base App Tile with rounded corners -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#bgGrad)" filter="url(#badgeShadow)" />
  <rect x="5.5" y="5.5" width="117" height="117" rx="28.5" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" />

  <!-- Globe / Exploration Meridian Lines (Delicate & high tech) -->
  <g opacity="0.28" stroke="#38bdf8" stroke-width="1.8" fill="none">
    <!-- Equator -->
    <ellipse cx="64" cy="64" rx="46" ry="16" transform="rotate(-18 64 64)" />
    <!-- Prime Meridian curve -->
    <ellipse cx="64" cy="64" rx="22" ry="46" transform="rotate(-18 64 64)" />
    <!-- Outer boundary glow ring -->
    <circle cx="64" cy="64" r="46" stroke-dasharray="3 4" stroke-width="1.2" />
  </g>

  <!-- Flight Travel Arc / Airplane contrail -->
  <path d="M 22 84 C 28 36, 80 18, 106 42" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="5 4" opacity="0.75" />

  <!-- Jet / Airplane cruising on the travel arc -->
  <g transform="translate(101, 38) rotate(42) scale(0.9)">
    <!-- Airplane silhouette -->
    <path d="M 0 -8 L 3 -2 L 11 1 L 11 3 L 3 2 L 3 7 L 6 9 L 6 10 L 0 9 L -6 10 L -6 9 L -3 7 L -3 2 L -11 3 L -11 1 L -3 -2 Z" fill="#ffffff" />
  </g>

  <!-- Hero Tourist Destination Pin (Icon of places, trips & sightseeing) -->
  <g filter="url(#pinShadow)">
    <!-- Outer white contrast halo around pin for 100% clarity on any tab color -->
    <path d="M 64 22 C 47.5 22 34 35.5 34 52 C 34 71 58 97.5 61.5 101.2 C 62.8 102.6 65.2 102.6 66.5 101.2 C 70 97.5 94 71 94 52 C 94 35.5 80.5 22 64 22 Z" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round" />
    
    <!-- Main Pin Body in vibrant sunset coral gradient -->
    <path d="M 64 22 C 47.5 22 34 35.5 34 52 C 34 71 58 97.5 61.5 101.2 C 62.8 102.6 65.2 102.6 66.5 101.2 C 70 97.5 94 71 94 52 C 94 35.5 80.5 22 64 22 Z" fill="url(#pinGrad)" />
    
    <!-- Pin top glossy reflection highlight -->
    <ellipse cx="64" cy="33" rx="16" ry="6" fill="#ffffff" opacity="0.3" />

    <!-- Inner Disc / Sightseeing Lens (White circular core) -->
    <circle cx="64" cy="52" r="18" fill="#ffffff" />
    <circle cx="64" cy="52" r="15" fill="#091e3a" />

    <!-- Explorer Compass Star (8-point Navigation & Tourism emblem) -->
    <g transform="translate(64, 52)">
      <!-- Diagonal subtle rays -->
      <polygon points="0,-12 3,-3 12,0 3,3 0,12 -3,3 -12,0 -3,-3" fill="#38bdf8" opacity="0.5" transform="rotate(45)" />
      <!-- North/South/East/West Primary Golden Arrows -->
      <polygon points="0,-13 3.2,-3 13,0 3.2,3 0,13 -3.2,3 -13,0 -3.2,-3" fill="url(#goldGrad)" />
      <!-- Center Compass Pivot -->
      <circle cx="0" cy="0" r="2.8" fill="#ffffff" />
      <circle cx="0" cy="0" r="1.4" fill="#091e3a" />
    </g>
  </g>

  <!-- Live Pulse Dot in corner (SafeTrip AI signature) -->
  <circle cx="106" cy="22" r="4.5" fill="#10b981" />
  <circle cx="106" cy="22" r="7" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6" />
</svg>